name: NEXORA Security Toolkit tests

on:
  push:
    paths:
      - "security-toolkit/**"
      - ".github/workflows/nexora-security-toolkit.yml"
  pull_request:
    paths:
      - "security-toolkit/**"
      - ".github/workflows/nexora-security-toolkit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-toolkit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for dashboard syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python nexora_security.py --help
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/dashboard.js
